# J2MEWP: Windows Phone / Windows 10 Mobile ARM, ARM-mode interpreter + JIT
# (cpu/arm, like javacall_wince_arm). The cpu/thumb2 port needs ThumbEE, which
# W10M CPUs do not have. Host = win32 i386 (VS2017): only loopgen / romgen /
# target headers are produced here; JvmCore (MSBuild) compiles the target.
#
# Float: soft-float. Generated code calls jvm_fadd()... with the softfp
# convention (args/results in r0-r3); Windows ARM C is hard-float, so the
# names are redirected to *_sf shims (Project/Shared/host/arm_softfp_glue.c).

host_os        = win32
host_arch      = i386
os_family      = win32
host_compiler  = visCPP
CPP_DEF_FLAGS += -DADS_LINUX_HOST=0

MakeDepsMain_javacall = WinGammaPlatform
MakeDepsOpts_javacall = -resolveVpath true

export MSW_FIRST_FOR_DOUBLE      := false
export MSW_FIRST_FOR_DOUBLE__BY  := javacall_winphone_arm.cfg
export ENABLE_SOFT_FLOAT         := true
export ENABLE_SOFT_FLOAT__BY     := javacall_winphone_arm.cfg
# CPU is ARMv7+, but ENABLE_ARM_V7 belongs to the Thumb-2 port (cpu/arm lacks its hooks)
export ENABLE_ARM_V5TE           := true
export ENABLE_ARM_V5TE__BY       := javacall_winphone_arm.cfg
export ENABLE_ARM_V6             := true
export ENABLE_ARM_V6__BY         := javacall_winphone_arm.cfg
export ENABLE_BRUTE_FORCE_ICACHE_FLUSH     := false
export ENABLE_BRUTE_FORCE_ICACHE_FLUSH__BY := javacall_winphone_arm.cfg

LOOP_GEN_FLAGS = -GenerateGNUCode +GenerateMicrosoftCode +GenerateThumbInterwork +AddExternCUnderscore
ROM_GEN_FLAGS  =

ifeq ($(IsLoopGen),true)
    arch           = arm
    compiler       = $(host_compiler)
    CPP_DEF_FLAGS += /wd4996 /wd4819 -DARM=1 -DCROSS_GENERATOR=1 -DEVC_ASM_QUIRK=1
endif

ifeq ($(IsRomGen),true)
    os_family = win32
    arch      = i386
    compiler  = $(host_compiler)
    export ENABLE_C_INTERPRETER             := true
    export ENABLE_C_INTERPRETER__BY         := javacall_winphone_arm.cfg
    export ENABLE_INTERPRETER_GENERATOR     := false
    export ENABLE_INTERPRETER_GENERATOR__BY := javacall_winphone_arm.cfg
    export TARGET_MSW_FIRST_FOR_DOUBLE      := false
    export TARGET_MSW_FIRST_FOR_DOUBLE__BY  := javacall_winphone_arm.cfg
    export TARGET_MSW_FIRST_FOR_LONG        := false
    export TARGET_MSW_FIRST_FOR_LONG__BY    := javacall_winphone_arm.cfg
    carch          = arm
    iarch          = c
    CPP_DEF_FLAGS += /wd4819 /wd4996 -DARM -D_CRT_SECURE_NO_WARNINGS -DCROSS_GENERATOR=1
    copy_romgen_manifest := true
    # jvm.make links romgen once without $(BUILD_PCH) -> LNK2011 on modern MSVC
    LINK_FLAGS += _build_pch_visCPP.obj
endif

ifeq ($(IsTarget),true)
    os_family = javacall
    arch      = arm
    compiler  = visCPP
    CPP_DEF_FLAGS += -DARM
    export ENABLE_INTERPRETER_GENERATOR := false
    export ENABLE_ROM_GENERATOR         := false
endif

# Must match the x86 MIDP build (classes.zip contains com.sun.cldc.isolate.*)
export ENABLE_ISOLATES     := true
export ENABLE_ISOLATES__BY := javacall_winphone_arm.cfg
