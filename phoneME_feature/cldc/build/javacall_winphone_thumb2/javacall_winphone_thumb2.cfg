# J2MEWP: Windows Phone / Windows 10 Mobile ARM (Thumb-2) build.
# Host = win32 i386 (VS2017). Only loopgen (+ romgen) run here; the target
# is compiled by the Visual Studio projects in Project/ (JvmCore).

host_os        = win32
host_arch      = i386
os_family      = win32
host_compiler  = visCPP
CPP_DEF_FLAGS += -DADS_LINUX_HOST=0

export ENABLE_THUMB_COMPILER     := true
export ENABLE_THUMB_COMPILER__BY := javacall_winphone_thumb2.cfg
export MSW_FIRST_FOR_DOUBLE      := false
export MSW_FIRST_FOR_DOUBLE__BY  := javacall_winphone_thumb2.cfg

# Microsoft armasm syntax for the generated interpreter
LOOP_GEN_FLAGS = -GenerateGNUCode +GenerateMicrosoftCode +GenerateThumbInterwork
ROM_GEN_FLAGS  =

ifeq ($(IsLoopGen),true)
    arch           = thumb2
    compiler       = $(host_compiler)
    CPP_DEF_FLAGS += /wd4996 /wd4819 -DARM=1 -DCROSS_GENERATOR=1
endif

ifeq ($(IsRomGen),true)
    os_family = win32
    arch      = i386
    compiler  = $(host_compiler)
    export ENABLE_C_INTERPRETER             := true
    export ENABLE_C_INTERPRETER__BY         := javacall_winphone_thumb2.cfg
    export ENABLE_INTERPRETER_GENERATOR     := false
    export ENABLE_INTERPRETER_GENERATOR__BY := javacall_winphone_thumb2.cfg
    export TARGET_MSW_FIRST_FOR_DOUBLE      := false
    export TARGET_MSW_FIRST_FOR_DOUBLE__BY  := javacall_winphone_thumb2.cfg
    export TARGET_MSW_FIRST_FOR_LONG        := false
    export TARGET_MSW_FIRST_FOR_LONG__BY    := javacall_winphone_thumb2.cfg
    carch          = thumb2
    iarch          = c
    CPP_DEF_FLAGS += /wd4819 /wd4996 -DARM -D_CRT_SECURE_NO_WARNINGS -DCROSS_GENERATOR=1
    copy_romgen_manifest := true
    # jvm.make links romgen once without $(BUILD_PCH) -> LNK2011 on modern MSVC
    LINK_FLAGS += _build_pch_visCPP.obj
endif

ifeq ($(IsTarget),true)
    os_family = javacall
    arch      = thumb2
    compiler  = visCPP
    export ENABLE_INTERPRETER_GENERATOR := false
    export ENABLE_ROM_GENERATOR         := false
endif

# Thumb-2 port only generates soft-float stubs: float bytecodes call the C
# jvm_fadd()... helpers (MSVC ARM compiles those with VFP instructions).
export ENABLE_SOFT_FLOAT     := true
export ENABLE_SOFT_FLOAT__BY := javacall_winphone_thumb2.cfg

MakeDepsMain_javacall = WinGammaPlatform
MakeDepsOpts_javacall = -resolveVpath true

# Same CPU/feature set as the reference Thumb-2 config (linux_jazelle_rct.cfg):
# ARMv7 (Windows on ARM requires it) and the optimizations that the
# Thumb-2 port does not implement turned off.
export ENABLE_ARM_V7                               := false
export ENABLE_ARM_V7__BY                           := javacall_winphone_thumb2.cfg
export ENABLE_ARM_V6T2                             := true
export ENABLE_ARM_V6T2__BY                         := javacall_winphone_thumb2.cfg
export ENABLE_THUMB_VM                             := false
export ENABLE_THUMB_VM__BY                         := javacall_winphone_thumb2.cfg
# (ENABLE_THUMB_VM = ThumbEE enterx/leavex: not available on Windows ARM)
export ENABLE_CONDITIONAL_BRANCH_OPTIMIZATIONS     := false
export ENABLE_CONDITIONAL_BRANCH_OPTIMIZATIONS__BY := javacall_winphone_thumb2.cfg
export ENABLE_BRUTE_FORCE_ICACHE_FLUSH             := false
export ENABLE_BRUTE_FORCE_ICACHE_FLUSH__BY         := javacall_winphone_thumb2.cfg
export ENABLE_INLINE                               := false
export ENABLE_INLINE__BY                           := javacall_winphone_thumb2.cfg
export ENABLE_INLINED_ARRAYCOPY                    := false
export ENABLE_INLINED_ARRAYCOPY__BY                := javacall_winphone_thumb2.cfg
export ENABLE_EMBEDDED_CALLINFO                    := false
export ENABLE_EMBEDDED_CALLINFO__BY                := javacall_winphone_thumb2.cfg
# The Thumb-2 port has no multi-task globals (_current_task...): single VM task.
export ENABLE_ISOLATES                             := true
export ENABLE_ISOLATES__BY                         := javacall_winphone_thumb2.cfg
